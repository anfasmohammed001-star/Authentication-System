"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "frontend"
  functions = "netlify/functions"

# 1. API proxy to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. Clean URL rewrites for authentication pages
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# 3. Root & fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 4. Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
